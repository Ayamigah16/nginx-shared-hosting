# Nginx Virtual Host Configuration - Site 1
# Replace DOMAIN1_PLACEHOLDER with your actual DuckDNS domain (e.g., site1.duckdns.org)

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain
    server_name DOMAIN1_PLACEHOLDER;
    
    # Document root - where your website files are located
    root /var/www/SITE1_DIR;
    
    # Index file
    index index.html index.htm;
    
    # Logging
    access_log /var/log/nginx/site1-access.log;
    error_log /var/log/nginx/site1-error.log;
    
    # Main location block
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
